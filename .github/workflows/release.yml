name: release

# V23 release automation: only a strict stable SemVer tag (vMAJOR.MINOR.PATCH)
# can publish. The run is fail-closed: tag identity, branch reachability,
# existing-release immutability, the full V21 gate set, blocking image scans,
# digest association, SBOMs, and attestations must all succeed before any
# image is pushed or a GitHub Release is created. After publication, an
# independent production verification checks the registry digests and GitHub
# attestations; partial publication is reported with explicit recovery steps.
on:
  push:
    tags: ["v*"]

# No default permissions: each job requests only what it needs.
permissions: {}

# Serialize runs for the same tag; never cancel a release part-way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Scanner images are pinned by digest, not tag (see tools/release/workflows.py).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Reachability and tag resolution require the tagged commit and
          # the deployment branch in the local history.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate release tag and commit
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m tools.release.cli validate-tag --tag "$TAG"
          python -m tools.release.cli verify-tag-commit \
            --tag "$TAG" --commit "$COMMIT" --repo-root . --main-ref origin/main
      - name: Refuse existing release or published tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fails closed: a 403/network error is not treated as "tag absent".
          python -m tools.release.cli check-release --repo "$REPO" --tag "$TAG"

  # Same blocking gates as ci.yml. Kept explicit (rather than a reusable
  # workflow) so branch-protection check names and local reproducibility are
  # unchanged; tools/release/workflows.py rejects unpinned actions.
  gates:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Backend tests
        run: pytest backend/tests -v
      - name: Backend lint and formatting
        run: |
          ruff check backend tools
          ruff format --check backend tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Frontend gates
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm run test:run
          npm run build
      - name: Python dependency audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off
          pip-audit -r backend/requirements-dev.txt --progress-spinner off
      - name: Frontend dependency audit (production deps)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner
      - name: Filesystem and IaC scan (trivy)
        run: |
          docker run --rm -v "$PWD:/repo" -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" fs /repo \
            --scanners vuln,misconfig --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --no-progress
      - name: Workflow pinning audit
        run: python -m tools.release.cli audit-workflows --root .

  publish:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Production verification resolves the tag and proves ancestry from
          # origin/main, so the publish job needs full history and tags.
          fetch-depth: 0
      - name: Prepare runner disk for the CUDA image
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker image prune -af || true
          df -h /
          # Three images (including CUDA torch) plus trivy must fit. Fail
          # before building rather than part-way through a release.
          AVAILABLE_KB=$(df --output=avail -k / | tail -n 1)
          if [ "$AVAILABLE_KB" -lt 20971520 ]; then
            echo "::error::insufficient disk space (20 GiB required) for release images"
            exit 1
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase image references
        id: meta
        run: |
          set -euo pipefail
          REPO_LC=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "repo=${REPO_LC}"
            echo "api=${REGISTRY}/${REPO_LC}/api"
            echo "web=${REGISTRY}/${REPO_LC}/web"
            echo "api_gpu=${REGISTRY}/${REPO_LC}/api-gpu"
          } >> "$GITHUB_OUTPUT"
      - name: Build release images
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          LABELS=(
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${COMMIT}"
            --label "org.opencontainers.image.version=${VERSION}"
          )
          docker build -f backend/Dockerfile "${LABELS[@]}" -t ivp-api:release .
          docker build -f frontend/Dockerfile "${LABELS[@]}" -t ivp-web:release .
          docker build -f backend/Dockerfile.gpu "${LABELS[@]}" -t ivp-api-gpu:release .
      - name: Scan release images (blocking)
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          TRIVY_VERSION=$(docker run --rm "$TRIVY_IMAGE" --version | awk '/^Version:/ {print $2}')
          if [ -z "$TRIVY_VERSION" ]; then
            echo "::error::could not determine the trivy version"
            exit 1
          fi
          printf '%s\n' "$TRIVY_VERSION" > release-artifacts/trivy-version.txt
          for image in api web api-gpu; do
            echo "Scanning ivp-${image}:release"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}/release-artifacts:/artifacts" \
              -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              --timeout 40m \
              --format table \
              --output "/artifacts/${image}.scan.txt" \
              "ivp-${image}:release"
          done
      - name: Publish images and prove digest association
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO_LC=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p release-artifacts
          for image in api web api-gpu; do
            REPOSITORY="${REGISTRY}/${REPO_LC}/${image}"
            LOCAL="ivp-${image}:release"
            TARGET="${REPOSITORY}:${TAG}"
            SHORT_TARGET="${REPOSITORY}:sha-${SHORT_SHA}"
            LOCAL_ID=$(docker image inspect --format '{{.Id}}' "$LOCAL")
            SIZE=$(docker image inspect --format '{{.Size}}' "$LOCAL")

            # Record the intent before the first push. If the job dies after a
            # push but before digest proof, the publication report marks the
            # image as unknown instead of claiming it was never published.
            printf '{"image":"%s","status":"push_started","tag":"%s","repository":"%s","timestamp":"%s"}\n' \
              "$image" "$TAG" "$REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              >> release-artifacts/published-images.jsonl

            docker tag "$LOCAL" "$TARGET"
            docker tag "$LOCAL" "$SHORT_TARGET"
            docker push "$TARGET" | tee "release-artifacts/${image}.push.log"
            docker push "$SHORT_TARGET" > /dev/null

            # Query the registry for the authoritative digest instead of
            # parsing human-readable push output.
            DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$TARGET")
            if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::could not resolve a valid registry digest for ${image}"
              exit 1
            fi

            # Drop every local reference, then re-pull by digest. Matching
            # image IDs prove the digest points at the image that was scanned.
            docker image rm "$LOCAL" "$TARGET" "$SHORT_TARGET" > /dev/null 2>&1 || true
            docker pull "${REPOSITORY}@${DIGEST}" > /dev/null
            PULLED_ID=$(docker image inspect --format '{{.Id}}' "${REPOSITORY}@${DIGEST}")
            if [ "$PULLED_ID" != "$LOCAL_ID" ]; then
              echo "::error::digest association failed for ${image}: built ${LOCAL_ID}, pulled ${PULLED_ID}"
              exit 1
            fi

            printf '{"image":"%s","status":"pushed","tag":"%s","repository":"%s","digest":"%s","image_id":"%s","timestamp":"%s"}\n' \
              "$image" "$TAG" "$REPOSITORY" "$DIGEST" "$PULLED_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              >> release-artifacts/published-images.jsonl

            KEY=$(printf '%s' "$image" | tr '-' '_')
            {
              echo "${KEY}_digest=${DIGEST}"
              echo "${KEY}_image_id=${PULLED_ID}"
              echo "${KEY}_size=${SIZE}"
            } >> "$GITHUB_OUTPUT"
          done
      - name: Generate SPDX SBOMs from published digests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in api web api-gpu; do
            case "$image" in
              api) DIGEST="${{ steps.push.outputs.api_digest }}" ;;
              web) DIGEST="${{ steps.push.outputs.web_digest }}" ;;
              api-gpu) DIGEST="${{ steps.push.outputs.api_gpu_digest }}" ;;
            esac
            REPOSITORY="${{ steps.meta.outputs.repo }}"
            echo "Generating SBOM for ${image}@${DIGEST}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}/release-artifacts:/artifacts" \
              -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image \
              --format spdx-json \
              --no-progress \
              --timeout 40m \
              --output "/artifacts/${image}.spdx.json" \
              "${REGISTRY}/${REPOSITORY}/${image}@${DIGEST}"
            docker image rm "${REGISTRY}/${REPOSITORY}/${image}@${DIGEST}" > /dev/null 2>&1 || true
          done
      - name: Attest provenance (api)
        id: attest_api_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.api }}
          subject-digest: ${{ steps.push.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM (api)
        id: attest_api_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.api }}
          subject-digest: ${{ steps.push.outputs.api_digest }}
          sbom-path: release-artifacts/api.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest provenance (web)
        id: attest_web_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.web }}
          subject-digest: ${{ steps.push.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM (web)
        id: attest_web_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.web }}
          subject-digest: ${{ steps.push.outputs.web_digest }}
          sbom-path: release-artifacts/web.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest provenance (api-gpu)
        id: attest_gpu_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.api_gpu }}
          subject-digest: ${{ steps.push.outputs.api_gpu_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM (api-gpu)
        id: attest_gpu_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.api_gpu }}
          subject-digest: ${{ steps.push.outputs.api_gpu_digest }}
          sbom-path: release-artifacts/api-gpu.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Collect attestation evidence
        run: |
          set -euo pipefail
          cp "${{ steps.attest_api_provenance.outputs.bundle-path }}" release-artifacts/api.provenance.jsonl
          cp "${{ steps.attest_api_sbom.outputs.bundle-path }}" release-artifacts/api.sbom-attestation.jsonl
          cp "${{ steps.attest_web_provenance.outputs.bundle-path }}" release-artifacts/web.provenance.jsonl
          cp "${{ steps.attest_web_sbom.outputs.bundle-path }}" release-artifacts/web.sbom-attestation.jsonl
          cp "${{ steps.attest_gpu_provenance.outputs.bundle-path }}" release-artifacts/api-gpu.provenance.jsonl
          cp "${{ steps.attest_gpu_sbom.outputs.bundle-path }}" release-artifacts/api-gpu.sbom-attestation.jsonl
      - name: Generate and validate release manifest
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SCAN_VERSION=$(cat release-artifacts/trivy-version.txt)
          REPO_LC=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg run_url "$RUN_URL" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg created_at "$CREATED_AT" \
            --arg scan_version "$SCAN_VERSION" \
            --arg api_digest "${{ steps.push.outputs.api_digest }}" \
            --arg api_image_id "${{ steps.push.outputs.api_image_id }}" \
            --argjson api_size "${{ steps.push.outputs.api_size }}" \
            --arg web_digest "${{ steps.push.outputs.web_digest }}" \
            --arg web_image_id "${{ steps.push.outputs.web_image_id }}" \
            --argjson web_size "${{ steps.push.outputs.web_size }}" \
            --arg gpu_digest "${{ steps.push.outputs.api_gpu_digest }}" \
            --arg gpu_image_id "${{ steps.push.outputs.api_gpu_image_id }}" \
            --argjson gpu_size "${{ steps.push.outputs.api_gpu_size }}" \
            '{
              tag: $tag,
              commit: $commit,
              source_repository: $source_repository,
              workflow: ".github/workflows/release.yml",
              workflow_run_url: $run_url,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              created_at: $created_at,
              gpu_runtime_smoke: "not_run",
              gpu_runtime_smoke_reason: "GPU infrastructure unavailable on the GitHub-hosted release runner",
              images: [
                {
                  name: "api",
                  digest: $api_digest,
                  image_id: $api_image_id,
                  pulled_image_id: $api_image_id,
                  platform: "linux/amd64",
                  size_bytes: ($api_size | tonumber),
                  sbom_file: "api.spdx.json",
                  scan_log_file: "api.scan.txt",
                  scan_version: $scan_version,
                  provenance_bundle_file: "api.provenance.jsonl",
                  sbom_attestation_bundle_file: "api.sbom-attestation.jsonl"
                },
                {
                  name: "web",
                  digest: $web_digest,
                  image_id: $web_image_id,
                  pulled_image_id: $web_image_id,
                  platform: "linux/amd64",
                  size_bytes: ($web_size | tonumber),
                  sbom_file: "web.spdx.json",
                  scan_log_file: "web.scan.txt",
                  scan_version: $scan_version,
                  provenance_bundle_file: "web.provenance.jsonl",
                  sbom_attestation_bundle_file: "web.sbom-attestation.jsonl"
                },
                {
                  name: "api-gpu",
                  digest: $gpu_digest,
                  image_id: $gpu_image_id,
                  pulled_image_id: $gpu_image_id,
                  platform: "linux/amd64",
                  size_bytes: ($gpu_size | tonumber),
                  sbom_file: "api-gpu.spdx.json",
                  scan_log_file: "api-gpu.scan.txt",
                  scan_version: $scan_version,
                  provenance_bundle_file: "api-gpu.provenance.jsonl",
                  sbom_attestation_bundle_file: "api-gpu.sbom-attestation.jsonl"
                }
              ]
            }' > release-artifacts/release-inputs.json
          python -m tools.release.cli generate \
            --inputs release-artifacts/release-inputs.json \
            --artifacts-dir release-artifacts \
            --output release-artifacts/release-manifest.json
          python -m tools.release.cli validate \
            --manifest release-artifacts/release-manifest.json \
            --artifacts-dir release-artifacts \
            --tag "$TAG" \
            --commit "$COMMIT"
      - name: Verify published artifacts and attestations (production)
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m tools.release.cli verify \
            --manifest release-artifacts/release-manifest.json \
            --artifacts-dir release-artifacts \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --profile production \
            --repo-root . \
            --main-ref origin/main \
            --output release-artifacts/release-verification.json
      - name: Record publication outcome
        if: always()
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          python -m tools.release.cli publication-report \
            --events release-artifacts/published-images.jsonl \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-artifacts/publication-report.json
      - name: Upload publication outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-report
          path: release-artifacts/publication-report.json
          retention-days: 90
          if-no-files-found: warn
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: warn

  # Artifact-scoped qualification is the final gate before a GitHub Release.
  # It binds the manifest bytes, verification report, publication digests, and
  # every evidence hash. It deliberately does not claim production
  # qualification: deployment, rollback rehearsal, and GPU runtime require a
  # real target host and are recorded separately by the operator.
  qualify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Qualify release artifacts
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m tools.release.cli qualify \
            --manifest release-artifacts/release-manifest.json \
            --artifacts-dir release-artifacts \
            --profile local_validation \
            --scope artifact \
            --verification-report release-artifacts/release-verification.json \
            --publication-report release-artifacts/publication-report.json \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --repo-root . \
            --main-ref origin/main \
            --require-live-evidence \
            --output release-artifacts/release-qualification.json
      - name: Upload qualification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qualification
          path: release-artifacts/release-qualification.json
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [publish, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-qualification
          path: release-artifacts
      - name: Re-validate manifest and evidence before release
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m tools.release.cli validate \
            --manifest release-artifacts/release-manifest.json \
            --artifacts-dir release-artifacts \
            --tag "$TAG" \
            --commit "$COMMIT"
          python -m tools.release.cli verify \
            --manifest release-artifacts/release-manifest.json \
            --artifacts-dir release-artifacts \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --profile local \
            --repo-root . \
            --main-ref origin/main
          python -m tools.release.cli check-report \
            --report release-artifacts/release-verification.json \
            --manifest release-artifacts/release-manifest.json \
            --require-production
          python -m tools.release.cli check-qualification \
            --report release-artifacts/release-qualification.json \
            --manifest release-artifacts/release-manifest.json \
            --verification-report release-artifacts/release-verification.json \
            --publication-report release-artifacts/publication-report.json
          python -m tools.release.cli publication-report \
            --events release-artifacts/published-images.jsonl \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --fail-on-incomplete
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq .body > "$NOTES"
          {
            echo
            python -m tools.release.cli summary --manifest release-artifacts/release-manifest.json
          } >> "$NOTES"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" \
            release-artifacts/release-manifest.json \
            release-artifacts/release-verification.json \
            release-artifacts/release-qualification.json \
            release-artifacts/publication-report.json \
            release-artifacts/api.spdx.json \
            release-artifacts/web.spdx.json \
            release-artifacts/api-gpu.spdx.json \
            release-artifacts/api.provenance.jsonl \
            release-artifacts/api.sbom-attestation.jsonl \
            release-artifacts/web.provenance.jsonl \
            release-artifacts/web.sbom-attestation.jsonl \
            release-artifacts/api-gpu.provenance.jsonl \
            release-artifacts/api-gpu.sbom-attestation.jsonl \
            release-artifacts/api.scan.txt \
            release-artifacts/web.scan.txt \
            release-artifacts/api-gpu.scan.txt

  # Runs when any part of the release fails. The publication report is
  # uploaded by the publish job with `if: always()`, so this job can explain
  # exactly which images were proven published and how to recover safely.
  recovery:
    needs: [publish, qualify, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: publication-report
          path: recovery-artifacts
      - name: Explain publication state and recovery
        run: |
          set -euo pipefail
          {
            echo "## Release recovery"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f recovery-artifacts/publication-report.json ]; then
            python -m tools.release.cli publication-summary \
              --report recovery-artifacts/publication-report.json \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No publication report was produced; assume no image push was proven." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Inspect GHCR before retrying. Never move, delete, or reuse the release tag." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
