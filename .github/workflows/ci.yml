name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Digest-pinned scanner container. The previous trivy-action pin resolved
  # through an unpinned setup-trivy tag, which broke the security and
  # image-scan jobs at runtime.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest backend/tests -v
      - name: Lint (ruff)
        run: |
          ruff check backend tools
          ruff format --check backend tools
      # Informational: the repository carries pre-existing type errors
      # outside V20's scope. Surfaced here without blocking the build.
      - name: Type check (mypy, informational)
        continue-on-error: true
        run: python -m mypy backend/app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: cd frontend && npm ci
      # V21: the lint gate is noninteractive and strict (eslint flat config,
      # --max-warnings=0). `next lint` is deprecated in Next 15 and prompted
      # for setup, so CI could never run it unattended.
      - name: Lint (eslint)
        run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck && npm run test:run && npm run build

  # V21 security gates. Every scanner here runs locally too (see
  # docs/SECURITY_SCANNING.md) so a red CI job is reproducible on a
  # developer machine.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans the full history, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Workflow pinning audit (V22)
        run: python -m tools.release.cli audit-workflows --root .
      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
          pip-audit -r backend/requirements-dev.txt --progress-spinner off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      # Production dependency tree only: the dev-only advisories are tracked
      # in docs/SECURITY_SCANNING.md with their accepted risk.
      - name: Frontend dependency audit (npm audit, production deps)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Filesystem + IaC scan (trivy)
        run: |
          docker run --rm -v "$PWD:/repo" -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" fs /repo \
            --scanners vuln,misconfig --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --no-progress

  # V21 container gates: build both production images exactly as the release
  # workflow does and scan the results. Blocking on CRITICAL,HIGH with a fix
  # available --ignore-unfixed.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build api image
        run: docker build -f backend/Dockerfile -t ivp-api:ci .
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t ivp-web:ci .
      - name: Trivy image scan (api)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image ivp-api:ci \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress
      - name: Trivy image scan (web)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image ivp-web:ci \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress

  deploy:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-validate
      GRAFANA_ADMIN_PASSWORD: ci-validate
      IVP_API_IMAGE: ghcr.io/example/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      IVP_WEB_IMAGE: ghcr.io/example/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      IVP_CPU_API_IMAGE: ghcr.io/example/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      IVP_GPU_API_IMAGE: ghcr.io/example/api-gpu@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose -f compose.yaml config
      - run: docker compose -f compose.yaml -f compose.dev.yaml config
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config
      - run: docker compose -f compose.yaml -f compose.monitoring.yaml config
      - run: docker compose -f compose.yaml -f compose.release.yaml config
      - run: docker compose -f compose.yaml -f compose.gpu.release.yaml config
