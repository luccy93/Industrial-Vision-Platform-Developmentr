[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP042 ignored: (str, Enum) is the intentional FastAPI/Pydantic pattern,
# kept for explicit JSON-schema/validation behaviour across Python versions.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
